name: Backtest Evaluation

on:
  workflow_run:
    workflows: ["Train RL Agent"]
    types: [completed]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install -r requirements.txt
      
      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model-${{ github.event.workflow_run.run_number }}
          path: models/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      
      - name: Run backtest on test data
        run: python scripts/backtest.py --pair EURUSD --split test
      
      - name: Generate report
        run: python scripts/generate_report.py
      
      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_number }}
          path: |
            results/backtest_*.html
            results/backtest_*.png
            results/metrics_*.json
          retention-days: 90

name: Train RL Agent

on:
  push:
    branches: [main]
    paths:
      - 'env/**'
      - 'agents/**'
      - 'configs/**'
      - '.github/workflows/train.yml'
  workflow_dispatch:
    inputs:
      total_timesteps:
        description: 'Training timesteps'
        default: '500000'
        required: false
      pair:
        description: 'Trading pair'
        default: 'EURUSD'
        required: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
      
      - name: Prepare data
        run: |
          python scripts/prepare_data.py \
            --pair ${{ github.event.inputs.pair || 'EURUSD' }}
      
      - name: Train agent
        run: |
          python scripts/train.py \
            --pair ${{ github.event.inputs.pair || 'EURUSD' }} \
            --timesteps ${{ github.event.inputs.total_timesteps || '500000' }}
      
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-${{ github.run_number }}
          path: models/
          retention-days: 30
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: training-results-${{ github.run_number }}
          path: results/
          retention-days: 30

  test:
    needs: train
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -e . -r requirements.txt
      
      - name: Download model
        uses: actions/download-artifact@v4
        with:
          name: trained-model-${{ github.run_number }}
          path: models/
      
      - name: Run unit tests
        run: pytest tests/ -v --cov=env --cov=agents --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

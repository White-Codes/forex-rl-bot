agent:
  algorithm: "PPO"
  
  ppo:
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    
  training:
    total_timesteps: 1_000_000
    eval_freq: 10_000
    save_freq: 50_000
    n_eval_episodes: 10
    early_stopping_patience: 5  # In eval cycles
